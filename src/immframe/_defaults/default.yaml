# immframe — default configuration.
# User config is deep-merged on top of this. Anything you don't override
# inherits the value below.
#
# Secrets (api_key, mqtt password, http password) live inline. The config
# file MUST be chmod 600. Any string value supports ${ENV_VAR} substitution
# from the process environment, so you can keep secrets out of the file:
#   api_key: ${IMMICH_API_KEY}

immich:
  url: https://immich.local                # no trailing slash
  api_key: ""                              # required — set in your config.yaml
  timeout_s: 10
  image_size: fullsize                     # 'preview' (~1440px) or 'fullsize' (original-res JPEG)
                                            # — 'fullsize' is the right pick for 4K displays

selection:
  default_mode: random                     # random | album | smart | scene | people | memory | recent | playlist
  album_ids: []                            # used when default_mode = album (or playlist entries)
  smart_query: ""                          # used when default_mode = smart (or playlist entries)
  people_ids: []                           # used when default_mode = people; empty = rotate all named
  recent_days: 30                          # window for default_mode = recent
  recent_field: created                    # 'created' (uploaded) or 'taken' (capture date)
  playlist: []                             # used when default_mode = playlist; see docs/configuration.md
  prefetch_count: 5                        # queue depth ahead of slideshow
  cache_dir: ""                            # prefetch cache; "" = /dev/shm (RAM, no SD-card wear) if present

video:
  enabled: true
  stream: true                             # play directly from Immich URL
  mute: true
  vo: gpu                                  # MPV video output: gpu | x11 | drm | sdl
  fit: contain                             # contain (letterbox, preserve aspect) | cover (fill + crop)
  # Live / motion photos (HEIC/JPEG with a short clip): still → clip → still
  live_photo_order: photo_first            # photo_first | video_first
  live_photo_hold_s: 2.0                   # photo_first: seconds the photo is fully shown before the clip
  live_photo_mode: once                    # once | loop | bounce | reverse | still
  live_photo_play_s: 6.0                   # loop/bounce run time; caps once/reverse (0 = none)
  live_photo_repeats: 0                    # loop/bounce: N cycles instead of play_s (0 = off)
  live_photo_speed: 1.0                    # 0.25 (slow-mo) … 4
  live_photo_pause_s: 0.0                  # freeze at each loop point / bounce turnaround
  live_photo_after: still                  # still = photo for the rest of the slide | next
  live_photo_hwdec: "no"                   # software decode (Pi's HW decoder plays these at ~0.2x)
  poster: true                             # render matted still poster before videos
  poster_hold_s: 3.0                       # seconds the poster is fully shown (after the crossfade) before MPV starts
  rotate: auto                             # auto | no | 0 | 90 | 180 | 270 (override container rotation)
  fullscreen: false                        # let the compositor fullscreen MPV (true only on non-kiosk desktops)
  max_play_s: 60.0                         # hard cap per video play (sec)
  hwdec: auto-copy                         # MPV --hwdec; auto-copy uses the Pi's HW decoders, "no" = software
  ensure_fullscreen: true                  # re-request fullscreen if a clip maps windowed ("tiny video")

collage:
  # Tile several photos into one frame. Works on top of ANY selection mode.
  enabled: false
  layout: auto                             # auto | grid | golden_ratio
                                            # auto: golden for ≤3 / mixed orientation,
                                            # grid for square counts (4, 9), else grid
  min_tiles: 3                             # random tile count per collage, in
  max_tiles: 6                             #   [min_tiles, max_tiles] (2..12)
  gap: 8                                   # px gutter between tiles + outer margin
  background: "#101018"                    # hex fill shown behind tiles / in the gaps
  fit: cover                               # cover (fill + crop) | contain (letterbox)
  tile_text: "date location"               # per-tile caption fields when the photos share nothing
                                            # (keys: caption date location name people tags); "" = off
  smart_caption: false                     # one caption for the whole collage when its photos
                                            # share a person/place/date; falls back to tile_text

viewer:
  # Carried through to viewer/display.py — see picframe wiki for the full
  # key reference. Only the most common ones listed.
  blur_edges: true
  fit_to_screen: true
  time_delay: 60                           # seconds between slides
  fade_time: 4                             # seconds for crossfade
  brightness: 1.0                          # 0.0 - 1.0
  mat_images: true
  portrait_pairs: true                     # two consecutive portraits share one slide
  show_clock: false
  show_text_tm: 20                         # seconds to keep overlay text up
  show_text_fm: "%b %-d, %Y"
  show_text: "title caption name date location"   # space-separated keys:
                                                   # title | caption | name | date | location | folder
  display_power: 2                         # how the Display switch powers the screen: 2 = wlr-randr (labwc),
                                            # 1 = xset (X11), 0 = vcgencmd (legacy), 3 = /sys/class/drm
  display_hdmi: HDMI-A-1                   # output name for display_power 2 / 3

control:
  # Phase-2 surface — wiring in progress. Disabled by default.
  mqtt:
    enabled: false
    host: homeassistant.local
    port: 1883
    user: ""
    password: ""
    base_topic: immframe
  http:
    enabled: false
    bind: 127.0.0.1                        # default loopback, not 0.0.0.0
    port: 8080
    auth: true
    username: ""
    password: ""
