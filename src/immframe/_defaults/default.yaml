# immframe — default configuration.
# User config is deep-merged on top of this. Anything you don't override
# inherits the value below.

immich:
  url: https://immich.local           # no trailing slash
  api_key_file: ~/.config/immframe/api_key
  timeout_s: 10

selection:
  default_mode: random                # random | album | smart
  album_ids: []                       # used when default_mode = album
  smart_query: ""                     # used when default_mode = smart
  prefetch_count: 5                   # queue depth ahead of slideshow

video:
  enabled: true
  stream: true                        # play directly from Immich URL; false = download first
  mute: true

viewer:
  # Carried through to viewer/display.py — see picframe wiki for full
  # documentation of these keys. Only the most common ones listed.
  blur_edges: true
  fit_to_screen: true
  time_delay: 60                      # seconds between slides
  fade_time: 4                        # seconds for crossfade
  mat_images: true
  show_text_tm: 20                    # seconds to keep overlay text up
  show_text_fm: "%b %-d, %Y"

control:
  # Phase-2 surface. Listed so the config shape is final.
  mqtt:
    enabled: false
    host: homeassistant.local
    port: 1883
    user: ""
    password_file: ""                 # never inline credentials in YAML
    base_topic: immframe
  http:
    enabled: false
    bind: 127.0.0.1                   # default loopback, not 0.0.0.0
    port: 8080
    auth: true
    auth_file: ~/.config/immframe/http_basic_auth
  peripherals:
    enabled: true
    input_type: keyboard              # keyboard | mouse | touch | none
