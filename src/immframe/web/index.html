<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>immframe</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="app-header">
    <h1>immframe</h1>
    <span id="connection" class="badge" data-status="loading">…</span>
  </header>

  <main class="app">
    <section class="card current">
      <div class="image-wrap">
        <img id="current-image" alt="" loading="lazy">
        <div id="image-placeholder" class="image-placeholder">no asset yet</div>
      </div>
      <dl class="meta">
        <dt>File</dt><dd id="meta-file">—</dd>
        <dt>Taken</dt><dd id="meta-date">—</dd>
        <dt>Where</dt><dd id="meta-where">—</dd>
        <dt>Camera</dt><dd id="meta-camera">—</dd>
        <dt>Kind</dt><dd id="meta-kind">—</dd>
      </dl>
    </section>

    <section class="card transport">
      <button id="btn-pause" type="button">Pause</button>
      <button id="btn-next" type="button">Next ▶</button>
    </section>

    <section class="card selection">
      <h2>Selection</h2>
      <div class="row">
        <label>Mode</label>
        <select id="mode">
          <option value="random">Random</option>
          <option value="album">Album</option>
          <option value="smart">Smart</option>
          <option value="scene">Scene</option>
          <option value="people">People</option>
          <option value="memory">On this day</option>
          <option value="recent">Recent uploads</option>
          <option value="playlist">Playlist (config)</option>
        </select>
      </div>
      <div class="row">
        <label>Albums</label>
        <input id="album-ids" type="text" placeholder="uuid-1, uuid-2" autocomplete="off">
      </div>
      <div class="row">
        <label>Query</label>
        <input id="smart-query" type="text" placeholder="family at the beach" autocomplete="off">
      </div>
      <div class="row">
        <label>People</label>
        <input id="people-ids" type="text" placeholder="empty = rotate all named" autocomplete="off">
      </div>
      <div class="row" id="scene-row" hidden>
        <label>Now showing</label>
        <span id="current-scene" class="num">—</span>
      </div>
    </section>

    <section class="card slideshow">
      <h2>Slideshow</h2>
      <div class="row">
        <label>Slide duration <span id="time-delay-value" class="num">60s</span></label>
        <input id="time-delay" type="range" min="1" max="600" step="1">
      </div>
      <div class="row">
        <label>Fade duration <span id="fade-time-value" class="num">4s</span></label>
        <input id="fade-time" type="range" min="0" max="30" step="0.5">
      </div>
      <div class="row">
        <label>Brightness <span id="brightness-value" class="num">1.00</span></label>
        <input id="brightness" type="range" min="0" max="1" step="0.05">
      </div>
    </section>

    <section class="card collage">
      <h2>Collage</h2>
      <div class="row toggle">
        <label for="collage-enabled">Collage mode</label>
        <input id="collage-enabled" type="checkbox">
      </div>
      <div class="row">
        <label>Layout</label>
        <select id="collage-layout">
          <option value="auto">Auto</option>
          <option value="grid">Grid</option>
          <option value="golden_ratio">Golden ratio</option>
        </select>
      </div>
      <div class="row">
        <label>Min tiles <span id="collage-min-tiles-value" class="num">3</span></label>
        <input id="collage-min-tiles" type="range" min="2" max="12" step="1">
      </div>
      <div class="row">
        <label>Max tiles <span id="collage-max-tiles-value" class="num">6</span></label>
        <input id="collage-max-tiles" type="range" min="2" max="12" step="1">
      </div>
    </section>

    <section class="card display">
      <h2>Display</h2>
      <div class="row toggle">
        <label for="display-is-on">Display on</label>
        <input id="display-is-on" type="checkbox">
      </div>
      <div class="row toggle">
        <label for="show-clock">Clock overlay</label>
        <input id="show-clock" type="checkbox">
      </div>
      <fieldset class="show-text">
        <legend>Overlay fields</legend>
        <label><input type="checkbox" data-st-key="caption"> Caption</label>
        <label><input type="checkbox" data-st-key="name"> Name</label>
        <label><input type="checkbox" data-st-key="date"> Date</label>
        <label><input type="checkbox" data-st-key="location"> Location</label>
        <label><input type="checkbox" data-st-key="people"> People</label>
        <label><input type="checkbox" data-st-key="tags"> Tags</label>
        <label><input type="checkbox" data-st-key="ocr"> OCR text</label>
      </fieldset>
    </section>

    <footer class="footer">
      <span>v<span id="version">…</span></span>
    </footer>
  </main>

  <script src="/static/app.js" defer></script>
</body>
</html>
