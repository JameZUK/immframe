<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0d12">
  <title>Sign in · immframe</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body class="login-body">
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-frame" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M9.9 4.2A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a17.6 17.6 0 0 1-2.2 3.3M6.6 6.6A17.4 17.4 0 0 0 1 12s4 8 11 8a10.7 10.7 0 0 0 5.4-1.4"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></symbol>
  </svg>

  <main class="login-card">
    <div class="login-brand">
      <div class="mark"><svg class="ic"><use href="#i-frame"/></svg></div>
      <h1>immframe</h1>
      <p>Sign in to control the photo frame</p>
    </div>

    <form id="login-form" novalidate>
      <div class="login-error" id="error" role="alert" hidden>
        <svg class="ic"><use href="#i-alert"/></svg><span id="error-text"></span>
      </div>
      <label class="field">
        <span>Username</span>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <span class="pw-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <button type="button" class="icon-btn" id="toggle-pw" aria-label="Show password" title="Show password"><svg class="ic"><use id="pw-icon" href="#i-eye"/></svg></button>
        </span>
      </label>
      <label class="check"><input type="checkbox" id="remember" checked> Keep me signed in on this device</label>
      <button type="submit" class="btn primary" id="submit"><span id="submit-text">Sign in</span></button>
    </form>
  </main>

  <script src="/static/login.js"></script>
</body>
</html>
